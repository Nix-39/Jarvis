<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis – förhandsvisning v2</title>
<style>
:root{
  --bg:#040404; --accent:#f0b43c; --accent-2:#ffd77a; --hot:#fff3cf;
  --dim:rgba(240,180,60,.15); --glow:rgba(240,180,60,.7);
  --text:#fff8e6; --muted:#a6987a; --line:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 42% 48%,var(--dim) 0%,transparent 50%),var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
#sparks{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 42% 50%,#000 25%,transparent 70%)}

/* header */
header{position:relative;z-index:5;display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--dim)}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:.35em;font-weight:700;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--glow);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.health{display:flex;gap:8px;margin-left:12px}
.chip{font-size:11px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--dim);padding:3px 9px;border-radius:20px;display:flex;gap:6px;align-items:center}
.chip i{width:7px;height:7px;border-radius:50%;background:#56d364;box-shadow:0 0 6px #56d364}
.spacer{flex:1}
.clock{font:600 13px Consolas,monospace;color:var(--accent-2);letter-spacing:.1em}
.btn{background:transparent;border:1px solid var(--dim);color:var(--text);padding:6px 12px;border-radius:4px;cursor:pointer;font:600 12px "Segoe UI";letter-spacing:.08em;transition:.2s}
.btn:hover,.btn.on{border-color:var(--accent);box-shadow:0 0 12px var(--glow);color:var(--hot)}

/* layout */
.layout{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:110px 1fr minmax(340px,30vw);min-height:0}

/* services column */
#services{display:flex;flex-direction:column;justify-content:center;gap:26px;align-items:center;border-right:1px solid var(--line)}

/* stage */
#stage{position:relative;display:flex;flex-direction:column;padding:18px 10px 10px;min-width:0}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible;pointer-events:none}
.guide{stroke:var(--accent);stroke-width:1;opacity:.10;transition:opacity .25s}
.guide.hot{opacity:.38}
#agents{position:relative;z-index:1;display:flex;justify-content:space-evenly}
.center{position:relative;z-index:1;flex:1;display:grid;place-items:center}

/* nodes */
.node{display:flex;flex-direction:column;align-items:center;gap:7px;width:96px;
  filter:drop-shadow(0 0 4px var(--dim));animation:breathe 4s ease-in-out infinite;transition:filter .25s,transform .25s}
.node:nth-child(2n){animation-delay:-1.3s}.node:nth-child(3n){animation-delay:-2.6s}
@keyframes breathe{50%{filter:drop-shadow(0 0 12px var(--dim))}}
.wrap{position:relative}
.oct{position:relative;width:74px;height:74px;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
  background:linear-gradient(160deg,var(--accent-2),var(--accent) 45%,#3a2a00);opacity:.5;transition:opacity .25s}
.oct-in{position:absolute;inset:2px;clip-path:inherit;background:radial-gradient(circle at 50% 35%,#18140c,#060504 70%);display:grid;place-items:center}
.oct svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.25s}
.label{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);text-align:center;transition:.25s}
.node.small{width:84px}.node.small .oct{width:52px;height:52px}.node.small .oct svg{width:24px;height:24px}.node.small .label{font-size:9.5px}
.ripple{position:absolute;inset:0;clip-path:inherit;background:var(--accent);opacity:0;pointer-events:none}
.node.active{animation:none;filter:drop-shadow(0 0 18px var(--glow)) drop-shadow(0 0 4px var(--accent-2));transform:scale(1.07)}
.node.active .oct{opacity:1}.node.active svg{stroke:var(--hot)}
.node.active .label{color:var(--hot);text-shadow:0 0 8px var(--glow)}
.node.active .ripple{animation:ripple 1.1s ease-out infinite}
.node.hit .oct{animation:hit .25s}
@keyframes hit{0%{filter:brightness(2.4)}100%{filter:none}}
@keyframes ripple{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.3)}}

/* core */
.core{position:relative;width:230px;height:230px;display:grid;place-items:center}
.ring{position:absolute;inset:0}
.ring svg{width:100%;height:100%;overflow:visible}
.ring circle{fill:none;stroke:var(--accent);filter:drop-shadow(0 0 3px var(--glow))}
.r1{animation:spin 24s linear infinite}.r2{animation:spin 14s linear infinite reverse}.r3{animation:spin 8s linear infinite}
.core.busy .r1{animation-duration:6s}.core.busy .r2{animation-duration:3.5s}.core.busy .r3{animation-duration:1.8s}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 0%,var(--hot) 14%,var(--accent) 38%,transparent 70%);
  box-shadow:0 0 40px var(--glow),0 0 90px var(--dim);animation:pulse 2.6s ease-in-out infinite}
.core.busy .orb{animation-duration:.8s}
.core.fire .orb{animation:fire .18s}
@keyframes pulse{50%{transform:scale(1.13);box-shadow:0 0 60px var(--glow),0 0 130px var(--dim)}}
@keyframes fire{50%{transform:scale(1.25);filter:brightness(1.6)}}
.title{position:absolute;bottom:-58px;width:360px;text-align:center}
.title h1{font:800 32px "Segoe UI";letter-spacing:.32em;padding-left:.32em;
  background:linear-gradient(180deg,#fff 10%,var(--hot) 40%,var(--accent) 78%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px var(--glow))}
.title p{margin-top:5px;font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;min-height:16px}
.title p b{color:var(--accent-2);font-weight:600}

/* chat / log panel */
#panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--accent);background:rgba(7,6,4,.92);
  box-shadow:-10px 0 40px rgba(0,0,0,.6),0 0 24px var(--dim)}
#panel h2{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;letter-spacing:.3em;padding:13px 16px;border-bottom:1px solid var(--dim);color:var(--accent-2)}
#panel h2 label{font-size:10.5px;letter-spacing:.08em;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
#log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.day{align-self:center;font-size:10px;letter-spacing:.25em;color:var(--muted);margin:4px 0}
.msg{max-width:90%;padding:9px 12px;border-radius:6px;font-size:13.5px;line-height:1.45;animation:in .3s}
.msg small{display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:3px;text-transform:uppercase}
.msg.user{align-self:flex-end;background:var(--dim);border:1px solid rgba(255,255,255,.06)}
.msg.jarvis{align-self:flex-start;background:#0e0c08;border:1px solid var(--accent);box-shadow:0 0 10px var(--dim)}
.msg .src{margin-top:6px;font-size:11px;color:var(--accent-2)}
.step{align-self:flex-start;font:11.5px Consolas,"Cascadia Mono",monospace;color:var(--muted);padding-left:10px;border-left:2px solid var(--dim);animation:in .3s}
.step b{color:var(--accent)}
.sys{align-self:center;font-size:11.5px;color:var(--accent-2);border:1px dashed var(--dim);border-radius:20px;padding:4px 12px;animation:in .3s}
body.hide-steps .step{display:none}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
#panel form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--dim)}
#panel input{flex:1;background:#0b0a07;border:1px solid var(--dim);color:var(--text);padding:11px 13px;border-radius:4px;font:14px "Segoe UI";outline:none}
#panel input:focus{border-color:var(--accent);box-shadow:0 0 14px var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.chips button{background:transparent;border:1px solid var(--dim);color:var(--muted);font-size:11px;padding:4px 9px;border-radius:14px;cursor:pointer}
.chips button:hover{color:var(--hot);border-color:var(--accent)}
</style>
</head>
<body>
<canvas id="sparks"></canvas><div class="grid"></div>

<header>
  <div class="brand"><span class="dot"></span>JARVIS</div>
  <div class="health">
    <span class="chip"><i></i>Ollama</span><span class="chip"><i></i>Webbsök</span><span class="chip"><i></i>Telegram</span>
  </div>
  <div class="spacer"></div>
  <span class="clock" id="clock"></span>
  <button class="btn on" id="sound">🔊 Ljud på</button>
</header>

<div class="layout">
  <aside id="services"></aside>
  <main id="stage">
    <svg id="fx">
      <defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
      <g id="guides"></g><g id="bolts"></g>
    </svg>
    <section id="agents"></section>
    <section class="center">
      <div class="core" id="core">
        <div class="ring r1"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" stroke-width=".5" stroke-dasharray="1 2.2"/></svg></div>
        <div class="ring r2" style="inset:20px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" stroke-width="1.2" stroke-dasharray="22 10 4 10"/></svg></div>
        <div class="ring r3" style="inset:44px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" stroke-width="2" stroke-dasharray="40 108"/></svg></div>
        <div class="orb"></div>
        <div class="title"><h1>JARVIS</h1><p id="status">Online · redo</p></div>
      </div>
    </section>
  </main>
  <aside id="panel">
    <h2>JARVIS LOGG <label><input type="checkbox" id="steps" checked> visa steg</label></h2>
    <div id="log"><div class="day">IDAG</div></div>
    <div class="chips"><button>Vad har jag idag?</button><button>Mina påminnelser</button><button>/status</button></div>
    <form id="ask"><input placeholder="Fråga Jarvis…  (Ctrl+Alt+J)" autocomplete="off"></form>
  </aside>
</div>

<script>
const $=id=>document.getElementById(id);
const agentsEl=$('agents'),servicesEl=$('services'),stage=$('stage'),core=$('core'),guides=$('guides'),bolts=$('bolts'),
      logEl=$('log'),statusEl=$('status'),soundBtn=$('sound');
const ICONS={
  business:'<path d="M4 20V10M10 20V5M16 20v-7M22 20H2"/><path d="M14 4h5v5"/><path d="M19 4l-6 6"/>',
  career:'<rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  webdev:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',
  education:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5M22 9v6"/>',
  general:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  social:'<path d="M3 10v4l11 5V5L3 10z"/><path d="M14 9a4 4 0 0 1 0 6M7 15l1.5 5h3"/>',
  content:'<rect x="3" y="6" width="13" height="12" rx="1.5"/><path d="M16 10l5-3v10l-5-3"/>',
  reminder:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  memory:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',
  web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  scheduler:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3L2 6M19 3l3 3"/>',
  telegram:'<path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/><path d="M9 13l12-9"/>',
};
const AGENTS=[['business_agent','business','Business'],['career_agent','career','Karriär'],['webdeveloper_agent','webdev','Webbutv.'],
  ['education_agent','education','Utbildning'],['general_agent','general','Allmänt'],['socialmediamanager_agent','social','Sociala medier'],
  ['contentcreator_agent','content','Innehåll'],['reminder_agent','reminder','Påminnelser']];
const SERVICES=[['memory','memory','Minne'],['web','web','Webbsök'],['scheduler','scheduler','Schema'],['telegram','telegram','Telegram']];
const NAMES=Object.fromEntries([...AGENTS,...SERVICES].map(a=>[a[0],a[2]]));
const nodeHTML=([id,icon,label],small)=>`<div class="node${small?' small':''}" data-id="${id}"><div class="wrap"><div class="oct"><div class="oct-in"><svg viewBox="0 0 24 24">${ICONS[icon]}</svg></div><div class="ripple"></div></div></div><div class="label">${label}</div></div>`;
agentsEl.innerHTML=AGENTS.map(a=>nodeHTML(a)).join('');
servicesEl.innerHTML=SERVICES.map(s=>nodeHTML(s,true)).join('');
const node=id=>document.querySelector(`.node[data-id="${id}"]`);

/* ---------- straight neon lines ---------- */
const NS='http://www.w3.org/2000/svg', ends={}, guideEls={};
function layout(){
  guides.innerHTML=''; const st=stage.getBoundingClientRect(), c=core.querySelector('.orb').getBoundingClientRect();
  const C={x:c.left+c.width/2-st.left,y:c.top+c.height/2-st.top};
  document.querySelectorAll('.node').forEach(n=>{
    const o=n.querySelector('.oct').getBoundingClientRect();
    const N={x:o.left+o.width/2-st.left,y:o.top+o.height/2-st.top};
    const dx=N.x-C.x, dy=N.y-C.y, d=Math.hypot(dx,dy), ux=dx/d, uy=dy/d, r=o.width/2;
    const A={x:C.x+ux*48,y:C.y+uy*48}, B={x:N.x-ux*r,y:N.y-uy*r};
    ends[n.dataset.id]={A,B};
    const l=document.createElementNS(NS,'line'); Object.entries({x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:'guide'}).forEach(([k,v])=>l.setAttribute(k,v));
    guides.appendChild(l); guideEls[n.dataset.id]=l;
  });
}
addEventListener('resize',layout); setTimeout(layout,60);

/* ---------- blaster bolts: 3 in a row ---------- */
function blast(id,toNode=true,count=3){
  const e=ends[id]; if(!e) return; const from=toNode?e.A:e.B, to=toNode?e.B:e.A;
  const dx=to.x-from.x, dy=to.y-from.y, dist=Math.hypot(dx,dy), ux=dx/dist, uy=dy/dist, len=Math.min(34,dist*.25), dur=Math.max(260,dist*0.9);
  const g=guideEls[id]; g.classList.add('hot'); setTimeout(()=>g.classList.remove('hot'),dur+count*120+200);
  if(!toNode) flash(id); else {core.classList.remove('fire'); void core.offsetWidth; core.classList.add('fire');}
  blip(toNode?760:520,.035,'square');
  for(let k=0;k<count;k++){
    const grp=document.createElementNS(NS,'g');
    const glow=document.createElementNS(NS,'line'), beam=document.createElementNS(NS,'line');
    glow.setAttribute('stroke','var(--accent)'); glow.setAttribute('stroke-width','8'); glow.setAttribute('stroke-linecap','round'); glow.setAttribute('filter','url(#blur)');
    beam.setAttribute('stroke','#fff8dc'); beam.setAttribute('stroke-width','2.6'); beam.setAttribute('stroke-linecap','round');
    grp.append(glow,beam); bolts.appendChild(grp);
    const start=performance.now()+k*115;
    (function step(t){
      const q=(t-start)/dur;
      if(q<0){grp.style.opacity=0; return requestAnimationFrame(step);}
      grp.style.opacity=1;
      const head=Math.min(q,1)*dist, tail=Math.max(0,head-len);
      const set=el=>{el.setAttribute('x1',from.x+ux*tail);el.setAttribute('y1',from.y+uy*tail);el.setAttribute('x2',from.x+ux*head);el.setAttribute('y2',from.y+uy*head);};
      set(glow); set(beam);
      if(q<1+len/dist) requestAnimationFrame(step);
      else { grp.remove(); if(k===count-1 && toNode) flash(id); }
    })(performance.now());
  }
}
function flash(id){const n=node(id); if(!n)return; n.classList.remove('hit'); void n.offsetWidth; n.classList.add('hit');}
function light(id,ms=1800){const n=node(id); if(!n)return; n.classList.add('active'); clearTimeout(n._t); if(ms) n._t=setTimeout(()=>n.classList.remove('active'),ms);}
function unlight(id){node(id)?.classList.remove('active');}

/* ---------- log panel ---------- */
const now=()=>new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
function add(el){logEl.appendChild(el); logEl.scrollTop=logEl.scrollHeight;}
function msg(who,text,meta,src){const m=document.createElement('div'); m.className='msg '+who;
  m.innerHTML=`<small><span>${meta}</span><span>${now()}</span></small>${text}`+(src?`<div class="src">Källor: ${src}</div>`:''); add(m);}
function step(text){const s=document.createElement('div'); s.className='step'; s.innerHTML=`<b>›</b> ${text}`; add(s);}
function sys(text){const s=document.createElement('div'); s.className='sys'; s.textContent=text; add(s);}
function busy(on,text){core.classList.toggle('busy',on); statusEl.innerHTML=on?text:'Online · redo';}

/* ---------- sound ---------- */
let soundOn=true, ac=null;
function blip(f=520,v=.04,type='sine'){ if(!soundOn) return; try{ ac=ac||new AudioContext(); const o=ac.createOscillator(),g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,ac.currentTime); o.frequency.exponentialRampToValueAtTime(f*.45,ac.currentTime+.12);
  g.gain.value=v; g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.14); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.15);}catch(e){} }
soundBtn.onclick=()=>{soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊 Ljud på':'🔇 Ljud av'; soundBtn.classList.toggle('on',soundOn);};
$('steps').onchange=e=>document.body.classList.toggle('hide-steps',!e.target.checked);

/* ---------- scripted demo ---------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function runQuery({via,text,category,agent,memory,web,reply,src,after}){
  if(via==='Telegram'){light('telegram',1400); blast('telegram',false); await wait(500);}
  msg('user',text,via);
  await wait(700); busy(true,`Analyserar · <b>router</b>`); step(`Kategori '${category}' → ${NAMES[agent]}`);
  await wait(500); busy(true,`Arbetar · <b>${NAMES[agent]}</b>`); blast(agent); light(agent,0);
  await wait(900);
  if(memory){busy(true,'Letar i <b>minnet</b>'); light('memory',1400); blast('memory'); await wait(650); blast('memory',false); step(memory); await wait(700);}
  if(web){busy(true,'Söker på <b>webben</b>'); light('web',2200); blast('web'); step(`Söker på webben: ${web}`); await wait(1400); blast('web',false);
    step('Hittade 5 källor'); await wait(800);}
  busy(true,`<b>${NAMES[agent]}</b> skriver svar`); await wait(1000); blast(agent,false); await wait(500); unlight(agent); busy(false);
  step(`${NAMES[agent]} svarade på ${(3+Math.random()*4).toFixed(1)} s`); msg('jarvis',reply,NAMES[agent],src); blip(980,.04);
  if(via==='Telegram'){await wait(400); blast('telegram'); light('telegram',1200);}
  if(after) await after();
}
const SCRIPT=[
  ()=>runQuery({via:'Terminal',text:'Hur kan VerkstadsFlow få fler kunder i höst?',category:'business',agent:'business_agent',
    memory:'Minnet: 2 samtal, 1 dokument',web:'bilverkstad marknadsföring lokalt 2026',src:'3 webbsidor',
    reply:'Tre snabba vinster: Google-recensioner efter varje jobb, en säsongskampanj för vinterdäck och en bokningsknapp på startsidan. Ska jag skissa ett mejl till dina befintliga kunder?'}),
  async()=>{await wait(1200); light('memory',1800); sys('Långtidsminnet uppdaterat · 4 nya meddelanden'); blip(300,.03);},
  ()=>runQuery({via:'Telegram',text:'påminn mig att ringa verkstaden imorgon kl 10',category:'reminders',agent:'reminder_agent',
    reply:'Ska jag lägga in: "Ring verkstaden" imorgon kl 10:00? (ja/nej)'}),
  ()=>runQuery({via:'Telegram',text:'ja',category:'svar på väntande fråga',agent:'reminder_agent',reply:'Klart! Jag påminner dig imorgon kl 10:00.',
    after:async()=>{await wait(400); blast('scheduler'); light('scheduler',1600); step('Ny påminnelse: Ring verkstaden');}}),
  async()=>{await wait(1600); light('scheduler',2400); blast('scheduler',false); await wait(700); blast('telegram'); light('telegram',1400);
    sys('⏰ Påminnelse skickad: Hämta på förskolan'); blip(990,.05);},
  ()=>runQuery({via:'Chatt',text:'Ge mig tre videoidéer om integritet på nätet',category:'content_creation',agent:'contentcreator_agent',
    memory:'Minnet: 1 samtal, 0 dokument',
    reply:'1) "Så spårar appar dig – och hur du stoppar det" 2) "Cookies förklarat på 60 sekunder" 3) "Testar: hur mycket vet Google om mig?"'}),
];
(async()=>{ await wait(900); sys('🟢 Jarvis är online'); for(;;){ for(const s of SCRIPT){ await s(); await wait(2400);} } })();

/* ---------- input ---------- */
$('ask').onsubmit=e=>{e.preventDefault(); const i=e.target.querySelector('input'), v=i.value.trim(); if(!v) return; i.value='';
  runQuery({via:'Chatt',text:v,category:'general',agent:'general_agent',memory:'Minnet: 0 samtal, 0 dokument',
    reply:'(Förhandsvisning) Här visas Jarvis riktiga svar när gränssnittet kopplas till Jarvis Core.'});};
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{const i=$('ask').querySelector('input'); i.value=b.textContent; $('ask').requestSubmit();});
addEventListener('keydown',e=>{ if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='j'){e.preventDefault(); $('ask').querySelector('input').focus();} });
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('sv-SE'),1000);

/* ---------- drifting sparks ---------- */
const cv=$('sparks'), ctx=cv.getContext('2d'); let sp=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight; sp=Array.from({length:70},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.5+.3,v:Math.random()*.25+.05,a:Math.random()*6}));}
addEventListener('resize',rs); rs();
(function draw(){ ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle='#f0b43c';
  for(const s of sp){ s.y-=s.v; s.a+=.012; if(s.y<-5){s.y=cv.height+5; s.x=Math.random()*cv.width;}
    ctx.globalAlpha=.2+.35*Math.abs(Math.sin(s.a)); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); }
  requestAnimationFrame(draw); })();
</script>
</body>
