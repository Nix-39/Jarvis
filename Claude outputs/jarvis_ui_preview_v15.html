<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yggdrasil – förhandsvisning v15</title>
<style>
:root{--bg:#040404;--accent:#f0b43c;--accent-2:#ffd77a;--hot:#fff3cf;--dim:rgba(240,180,60,.15);--glow:rgba(240,180,60,.7);
  --text:#fff8e6;--muted:#a6987a;--line:rgba(255,255,255,.045)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 55%,rgba(240,180,60,.10) 0%,transparent 45%),var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#sparks{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 55%,#000 20%,transparent 65%)}

header{position:relative;z-index:5;height:50px;display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:.35em;font-weight:700;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--glow);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.chip{font-size:12.5px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--dim);padding:4px 11px;border-radius:20px;display:flex;gap:6px;align-items:center;transition:.25s}
.chip i{width:7px;height:7px;border-radius:50%;background:#56d364;box-shadow:0 0 6px #56d364}
.chip.flash{border-color:var(--accent);color:var(--hot);box-shadow:0 0 14px var(--glow)}
.spacer{flex:1}
.lamps{position:absolute;left:var(--mid,50%);transform:translateX(-50%);display:flex;gap:10px}
#statusChip{position:absolute;top:50px;left:var(--mid,50%);transform:translateX(-50%);z-index:6;font-size:12px;letter-spacing:.14em;color:var(--muted);display:flex;gap:7px;align-items:center;white-space:nowrap}
#statusChip i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.5}
#statusChip.busy{color:var(--hot)}#statusChip.busy i{opacity:1;box-shadow:0 0 8px var(--glow);animation:blink .6s infinite}
#statusChip b{color:var(--accent-2);font-weight:600}
.chip{cursor:default}.chip.mail{cursor:pointer}.chip .n{background:#d9822b;color:#000;border-radius:8px;padding:0 5px;font-size:9.5px;letter-spacing:0;display:none}
.chip.mail.has .n{display:inline}.chip.mail.has i{background:var(--accent);box-shadow:0 0 6px var(--glow)}
#toast{position:absolute;top:2px;left:var(--tx,50%);transform:translate(0,-10px);z-index:9;opacity:0;pointer-events:none;transition:.35s;
  background:rgba(8,6,3,.85);backdrop-filter:blur(8px);border:1px solid var(--accent);border-radius:8px;padding:9px 14px;font-size:12.5px;box-shadow:0 0 20px var(--dim);min-width:280px}
#toast.show{opacity:1;transform:translate(0,0)}#toast small{display:block;color:var(--accent-2);font-size:10px;letter-spacing:.15em;margin-bottom:2px}
#mailbox{position:absolute;top:56px;z-index:9;width:330px;background:rgba(8,6,3,.88);backdrop-filter:blur(10px);border:1px solid var(--accent);border-radius:8px;padding:8px;display:none}
#mailbox.open{display:block}
.mail-i{padding:8px;border-radius:6px;font-size:12.5px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}.mail-i:hover{background:rgba(240,180,60,.08)}
.mail-i small{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px}.mail-i.unread b{color:var(--hot)}
.mail-foot{font-size:10.5px;color:var(--muted);text-align:center;padding:6px 4px 2px}
.secbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.secbtns button,.secbtns select{background:rgba(0,0,0,.3);border:1px solid var(--dim);color:var(--text);font-size:11px;padding:3px 8px;border-radius:12px;cursor:pointer}
.secbtns button:hover{border-color:var(--accent);color:var(--hot)}
.parked{opacity:.55;font-size:11.5px;display:flex;justify-content:space-between;gap:8px;padding:5px 9px}.parked button{background:none;border:0;color:var(--accent-2);cursor:pointer;font-size:11px}
.subhead{font-size:10px;letter-spacing:.25em;color:var(--muted);margin:12px 0 6px}
#panel h3 span{white-space:nowrap}
#panel h3 .pendbtn{margin-left:auto;font-size:11px;margin-right:10px;background:rgba(0,0,0,.3);border:1px solid var(--dim);color:var(--accent-2);border-radius:14px;padding:3px 10px;font:600 11px "Segoe UI";letter-spacing:.1em;cursor:pointer;display:flex;gap:6px;align-items:center}
#panel h3 .pendbtn:hover{border-color:var(--accent);color:var(--hot)}
.pendbtn em{font-style:normal;background:var(--dim);color:var(--hot);border-radius:8px;padding:0 6px}
#pending{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,86vw);background:rgba(8,6,3,.94);border:1px solid var(--accent);border-radius:10px;padding:14px;box-shadow:0 0 30px var(--dim);display:none}
#pending.open{display:block}
#pending h4{font-size:11.5px;letter-spacing:.28em;color:var(--accent-2);margin-bottom:10px;display:flex;justify-content:space-between}
#pending h4 button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
.pi{padding:9px 10px;border-radius:6px;background:rgba(255,255,255,.03);margin-bottom:7px;font-size:13px}
.pi small{display:block;color:var(--muted);font-size:11.5px;margin:2px 0 6px}
.pi button{background:rgba(0,0,0,.3);border:1px solid var(--dim);color:var(--text);font-size:11px;padding:3px 9px;border-radius:12px;cursor:pointer;margin-right:5px}
.pi button:hover{border-color:var(--accent);color:var(--hot)}
.clock{font:600 13px Consolas,monospace;color:var(--accent-2);letter-spacing:.1em}
.btn{background:transparent;border:1px solid var(--dim);color:var(--text);padding:6px 12px;border-radius:4px;cursor:pointer;font:600 12px "Segoe UI";letter-spacing:.08em}
.btn.on{border-color:var(--accent);box-shadow:0 0 12px var(--glow);color:var(--hot)}
.btn.gold{color:var(--accent-2);border-color:rgba(240,180,60,.55);box-shadow:0 0 10px rgba(240,180,60,.35);background:rgba(10,8,4,.4)}
.btn.gold:hover,.btn.gold:focus{color:var(--accent-2);box-shadow:0 0 18px var(--glow);outline:none}

#stage{position:absolute;top:50px;left:0;right:0;bottom:38px;z-index:2}
#sports{position:fixed;left:0;right:0;bottom:0;height:38px;z-index:6;display:flex;align-items:center;border-top:1px solid var(--dim);background:rgba(6,5,3,.7);backdrop-filter:blur(6px)}
#league{flex:none;height:100%;display:flex;align-items:center;gap:6px;padding:0 14px;border-right:1px solid var(--dim);font:700 12px "Segoe UI";letter-spacing:.18em;color:var(--accent-2);cursor:pointer;background:rgba(240,180,60,.06);position:relative}
#league:hover{color:var(--hot)}
#leagueMenu{position:absolute;bottom:42px;left:6px;width:200px;background:rgba(8,6,3,.95);border:1px solid var(--accent);border-radius:8px;padding:6px;display:none}
#leagueMenu.open{display:block}
#leagueMenu div{padding:6px 9px;border-radius:5px;font:600 12px "Segoe UI";letter-spacing:.1em;color:var(--text);cursor:pointer;display:flex;justify-content:space-between}
#leagueMenu div:hover{background:rgba(240,180,60,.1)}#leagueMenu div.on{color:var(--accent-2)}
#track{flex:1;overflow:hidden;height:100%;position:relative}
#tape{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-evenly;white-space:nowrap;transition:opacity .45s,transform .45s}
#tape.out{opacity:0;transform:translateY(-10px)}#tape.in{opacity:0;transform:translateY(10px);transition:none}
.game .dt{font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-right:2px}
#pager{flex:none;display:flex;gap:4px;padding:0 12px}#pager i{width:5px;height:5px;border-radius:50%;background:var(--dim)}#pager i.on{background:var(--accent)}
.game{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text)}
#track{cursor:pointer}
.game:hover{color:var(--hot)}
.game b{font:700 13.5px "Segoe UI"}.game .w{color:var(--hot)}.game .l{color:var(--muted)}
.game .st{font-size:10.5px;letter-spacing:.1em;color:var(--accent-2);border:1px solid var(--dim);border-radius:10px;padding:0 7px}
.game .st.live{color:#1a1205;background:#e05a4a;border-color:#e05a4a;animation:blink 1.4s infinite}
.game .x{font-size:11.5px;color:var(--muted)}
.sep{color:var(--accent);opacity:.5}
#scores{position:fixed;left:0;right:0;bottom:38px;z-index:7;max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.2,.8,.2,1);
  background:rgba(7,6,4,.9);backdrop-filter:blur(10px);border-top:1px solid var(--accent);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
#scores.open{max-height:62vh}
.sc-in{padding:12px 18px 16px;max-height:62vh;overflow-y:auto}
.sc-tabs{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sc-tabs .cbtn.on{background:var(--accent);color:#1a1205}
.sc-tabs .close{margin-left:auto}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{display:block;text-decoration:none;color:var(--text);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:10px 12px;background:rgba(255,255,255,.02);transition:.2s}
.card:hover{border-color:var(--accent);box-shadow:0 0 16px var(--dim);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.card .top .live{color:#e05a4a;font-weight:700;animation:blink 1.4s infinite}
.team{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:14px}
.team img,.team .lg{width:28px;height:28px;object-fit:contain;flex:none}
.team .lg{border-radius:50%;display:grid;place-items:center;font:700 10px "Segoe UI";color:#1a1205;background:var(--accent)}
.team .nm{flex:1}.team .pt{font:700 18px "Segoe UI"}.team.win .pt,.team.win .nm{color:var(--hot)}.team.lose{opacity:.6}
.card .note{margin-top:6px;font-size:11.5px;color:var(--accent-2)}
.card .go{float:right;font-size:10.5px;color:var(--muted)}
.box{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 12px}.box td,.box th{padding:5px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05)}
.box th{color:var(--muted);font-weight:600;font-size:11px}.box td:first-child,.box th:first-child{text-align:left}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.guide{stroke:var(--accent);stroke-width:1;opacity:.08;transition:opacity .25s}.guide.hot{opacity:.35}

/* left column: system + upcoming (floating, no panel) */
#left{position:absolute;left:18px;top:26px;bottom:18px;width:280px;z-index:4;display:flex;flex-direction:column;gap:18px}
.sys{border:1px solid var(--dim);border-radius:8px;padding:10px 12px;background:rgba(10,8,4,.32);backdrop-filter:blur(5px);font:12px Consolas,monospace;color:var(--muted)}
.sys .row{display:flex;justify-content:space-between;margin-bottom:3px}.sys b{color:var(--accent-2)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);margin:3px 0 7px;overflow:hidden}
.bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,var(--accent),var(--hot));box-shadow:0 0 8px var(--glow);transition:width .8s}
.spark{display:flex;align-items:flex-end;gap:2px;height:18px;margin-top:4px}.spark span{flex:1;background:var(--accent);opacity:.5;border-radius:1px;transition:height .5s}
.head{font-size:11.5px;letter-spacing:.3em;color:var(--accent-2);margin-bottom:8px}
#people{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:6px 0}
.person{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:0;overflow:hidden}
.pnode{flex:none;position:relative;width:70px;height:70px;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
  background:linear-gradient(160deg,var(--accent-2),var(--accent) 45%,#3a2a00);opacity:.5;transition:.25s}
.pnode b{position:absolute;inset:2px;clip-path:inherit;background:radial-gradient(circle at 50% 35%,#18140c,#060504 70%) center/cover no-repeat;display:grid;place-items:center;font:700 22px "Segoe UI";color:var(--accent)}
.pnode b.photo{color:transparent}
.person:hover .pnode{opacity:1;filter:drop-shadow(0 0 12px var(--glow))}
.person.soon .pnode{opacity:.75;animation:soon 3s ease-in-out infinite}
@keyframes soon{50%{filter:drop-shadow(0 0 7px var(--dim))}}
.pinfo{min-width:0;flex:1}
.pname{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--pc);text-shadow:0 0 8px color-mix(in srgb,var(--pc) 50%,transparent)}
.pev{font-size:12.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pev small{color:var(--muted);font-size:11px;margin-right:7px}
.pev.today small{color:var(--accent-2)}
.pev.none{color:var(--muted);font-size:12px;font-style:italic}
.pmore{font-size:11px;color:var(--accent-2);margin-top:1px;opacity:.85}
#cal{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(1000px,94vw);height:min(720px,90%);
  background:rgba(8,6,3,.9);backdrop-filter:blur(12px);border:1px solid var(--accent);border-radius:12px;box-shadow:0 0 50px var(--dim);padding:16px;
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.25s}
#cal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.calbar h3{font-size:12.5px;letter-spacing:.3em;color:var(--accent-2);margin-right:8px}
.calbar .nav{display:flex;align-items:center;gap:6px}
.cbtn{background:rgba(0,0,0,.35);border:1px solid var(--dim);color:var(--text);border-radius:6px;padding:5px 10px;font:600 12px "Segoe UI";cursor:pointer}
.cbtn:hover{border-color:var(--accent);color:var(--hot)}.cbtn.on{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.calbar .range{min-width:190px;text-align:center;font-size:13px;color:var(--hot)}
.filters{display:flex;gap:6px;margin-left:auto}
.fchip{border:1px solid var(--pc);color:var(--pc);background:rgba(0,0,0,.3);border-radius:14px;padding:3px 10px;font-size:11.5px;cursor:pointer;font-weight:600}
.fchip.off{opacity:.3;border-style:dashed}
.calbody{flex:1;min-height:0;overflow:auto}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:100%}
.wday{border:1px solid rgba(255,255,255,.06);border-radius:7px;padding:6px;min-height:0;overflow:auto;background:rgba(255,255,255,.015)}
.wday.today{border-color:var(--accent);box-shadow:inset 0 0 14px var(--dim)}
.wday h5{font-size:11.5px;color:var(--accent-2);margin-bottom:6px;letter-spacing:.08em}
.cev{border-left:3px solid var(--pc);background:color-mix(in srgb,var(--pc) 10%,transparent);border-radius:4px;padding:4px 6px;margin-bottom:5px;font-size:12px;line-height:1.3}
.cev small{display:block;color:var(--muted);font-size:10.5px}.cev .who{color:var(--pc);font-weight:600}
.month{display:grid;grid-template-columns:34px repeat(7,1fr);grid-template-rows:auto repeat(6,minmax(78px,1fr));gap:4px;height:100%}
.mhead{font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-align:center;padding:2px}
.wnum{display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font:600 11px Consolas,monospace;color:var(--accent-2);opacity:.7;cursor:pointer}
.wnum:hover{opacity:1}
.fchip.all{--pc:#9a9a9a;color:#bdbdbd;border-color:#6d6d6d}.fchip.all.on{background:rgba(255,255,255,.08);color:#eee;border-color:#aaa}
.mcell{border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:4px 5px;overflow:hidden;font-size:10.5px;cursor:pointer}
.mcell.other{opacity:.35}.mcell.today{border-color:var(--accent)}
.mcell b{display:block;color:var(--accent-2);font-size:11px;margin-bottom:2px}
.mev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}.mev i{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--pc);margin-right:4px}
.mmore{color:var(--muted)}
.openbtn{margin-top:12px;width:100%}
#upList{overflow:hidden}
.more{font-size:11px;color:var(--accent-2);padding:8px 2px;cursor:pointer;opacity:.8}.more:hover{opacity:1}
.ev{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.035);font-size:14px;opacity:.82}
.ev .c{width:3px;border-radius:2px;flex:none}
.ev small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.ev.today small{color:var(--accent-2)}

/* agents */
#agents{position:absolute;top:26px;z-index:4;display:flex;justify-content:space-between}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;width:100px;cursor:pointer;
  filter:drop-shadow(0 0 4px var(--dim));animation:breathe 4s ease-in-out infinite;transition:filter .25s,transform .25s}
.node:nth-child(2n){animation-delay:-1.3s}.node:nth-child(3n){animation-delay:-2.6s}
@keyframes breathe{50%{filter:drop-shadow(0 0 12px var(--dim))}}
.oct{position:relative;width:70px;height:70px;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
  background:linear-gradient(160deg,var(--accent-2),var(--accent) 45%,#3a2a00);opacity:.5;transition:opacity .25s}
.oct-in{position:absolute;inset:2px;clip-path:inherit;background:radial-gradient(circle at 50% 35%,#18140c,#060504 70%);display:grid;place-items:center}
.oct svg{width:33px;height:33px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.25s}
.label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;transition:.25s}
.ripple{position:absolute;inset:0;clip-path:inherit;background:var(--accent);opacity:0;pointer-events:none}
.node.active{animation:none;filter:drop-shadow(0 0 18px var(--glow)) drop-shadow(0 0 4px var(--accent-2));transform:scale(1.08)}
.node.active .oct{opacity:1}.node.active svg{stroke:var(--hot)}.node.active .label{color:var(--hot);text-shadow:0 0 8px var(--glow)}
.node.active .ripple{animation:ripple 1.1s ease-out infinite}
@keyframes ripple{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.3)}}
.node.hit .oct{animation:hit .25s}@keyframes hit{0%{filter:brightness(2.4)}100%{filter:none}}
.orbit{position:absolute;top:-6px;left:50%;width:84px;height:84px;margin-left:-42px;border-radius:50%;opacity:0;transition:opacity .3s;animation:spin 1.6s linear infinite;pointer-events:none}
.orbit::after{content:"🌐";position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:13px;filter:sepia(1) saturate(4) hue-rotate(-12deg) drop-shadow(0 0 4px var(--accent))}
.node.searching .orbit{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* tree */
#tree{position:absolute;z-index:2}
#myth{position:absolute;inset:0;z-index:1;pointer-events:none}
#bgwrap{position:absolute;z-index:0;pointer-events:none;opacity:0;transition:opacity .8s}
#bgimg{position:absolute;inset:0;background-size:100% 100%;filter:grayscale(1) sepia(.5) brightness(.78) contrast(1.12);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(transparent,#000 9%,#000 88%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(transparent,#000 9%,#000 88%,transparent);mask-composite:intersect}
#bgdim{position:absolute;inset:0;background:radial-gradient(ellipse 22% 34% at var(--dimx,46%) 42%,rgba(0,0,0,.55),transparent 100%)}
.pop{position:absolute;top:44px;right:0;z-index:12;width:330px;background:rgba(8,6,3,.94);backdrop-filter:blur(10px);border:1px solid var(--accent);border-radius:9px;padding:12px 14px;display:none;box-shadow:0 0 26px var(--dim)}
.pop.open{display:block}
.pop h4{font-size:11px;letter-spacing:.26em;color:var(--accent-2);margin-bottom:10px}
.srow{display:grid;grid-template-columns:22px 1fr 100px 36px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:9px}
.srow input[type=range]{width:100%;accent-color:#f0b43c}.srow .v{font:11px Consolas,monospace;color:var(--muted);text-align:right}
.srow button{background:none;border:0;cursor:pointer;font-size:14px;padding:0}.srow.muted{opacity:.45}

/* ---------- tree (version 2) ---------- */
const S=440, C=S/2; let tctx;
function rng(seed){return ()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};}
const T={segs:[],starts:[],pulses:[],tips:[]}, wellsPos=[], strands=[];
function seg(x,y,x2,y2,w,parent,bend=0){const mx=(x+x2)/2,my=(y+y2)/2,s={x,y,x2,y2,cx:mx-(y2-y)*bend,cy:my+(x2-x)*bend,w,kids:[]};const i=T.segs.push(s)-1;if(parent!=null)T.segs[parent].kids.push(i);return i;}
function branch(R,x,y,ang,len,w,depth,parent,o){ if(depth===0||len<3) return; const a=ang+(R()-.5)*o.jitter, x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len;
  const i=seg(x,y,x2,y2,w,parent,(R()-.5)*o.bend); const n=depth>o.forkDepth?o.forks:2;
  for(let k=0;k<n;k++) branch(R,x2,y2,a+(k-(n-1)/2)*o.spread*(n===2?1:.75),len*(o.lenF[0]+R()*(o.lenF[1]-o.lenF[0])),Math.max(.5,w*o.wF),depth-1,i,o);
  if(!T.segs[i].kids.length) T.tips.push(i); }
{ const R=rng(29); for(let k=0;k<7;k++) strands.push(k*2*Math.PI/7);
  const top=seg(C,C+60,C,C-30,4,null); T.segs[top].hidden=true; T.starts.push(top);
  for(const a of [-2.9,-2.5,-2.1,-1.75,-1.39,-1.05,-.65,-.25]) branch(R,C+Math.cos(a)*8,C-30,a,45,7,7,top,{jitter:.3,bend:.3,forks:3,forkDepth:5,spread:.48,lenF:[.66,.78],wF:.6});
  const bottom=seg(C,C-30,C,C+62,4,null); T.segs[bottom].hidden=true; T.starts.push(bottom);
  for(const [a,len] of [[2.45,62],[1.57,56],[.7,62]]){ let x=C,y=C+62,ang=a,par=bottom,w=12;
    for(let k=0;k<5;k++){ const x2=x+Math.cos(ang)*len*.32, y2=y+Math.sin(ang)*len*.32; par=seg(x,y,x2,y2,w,par,(R()-.5)*.5);
      if(k>0) branch(R,x2,y2,ang+(R()<.5?-1:1)*.8,len*.28,w*.4,3,par,{jitter:.4,bend:.4,forks:2,forkDepth:9,spread:.6,lenF:[.6,.75],wF:.6});
      x=x2;y=y2;w*=.78;ang+=(1.57-ang)*-.08; } wellsPos.push([x,y]); } }
const WELLS=[['mimer','Mimer','Minne'],['urd','Urd','Kalender'],['hvergelmer','Hvergelmer','Säkerhet']]; // left, middle, right
const wellLevel={urd:0,mimer:0,hvergelmer:0};
$('wells').innerHTML=WELLS.map(([id,n,r])=>`<div class="well" data-well="${id}"><div class="hit"></div><span>${n}${id==='hvergelmer'?'<em class="badge" id="secBadge">3</em>':''}</span><small>${r}</small></div>`).join('');
function glow(x,px,py,r,a){const g=x.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,`rgba(${HOT},${a})`); g.addColorStop(1,`rgba(${GOLD},0)`); x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();}
function quad(s,t){const u=1-t; return [u*u*s.x+2*u*t*s.cx+t*t*s.x2, u*u*s.y+2*u*t*s.cy+t*t*s.y2];}
let level=0, busyFlag=false;
let treeCache=null;
function buildTreeCache(){ const d=devicePixelRatio||1, c=document.createElement('canvas'); c.width=S*d; c.height=S*d; const x=c.getContext('2d'); x.scale(d,d);
  x.shadowColor=`rgba(${GOLD},.9)`; x.shadowBlur=7; x.lineCap='round';
  for(const s of T.segs){ if(s.hidden) continue; x.strokeStyle=`rgba(${GOLD},${Math.min(1,.35+s.w*.05)})`; x.lineWidth=s.w; x.beginPath(); x.moveTo(s.x,s.y); x.quadraticCurveTo(s.cx,s.cy,s.x2,s.y2); x.stroke(); }
  treeCache=c; }
function drawTree(t){ const x=tctx; x.clearRect(0,0,S,S); level+=((busyFlag?1:0)-level)*.05; const sway=0;
  glow(x,C,C+15,150,.09+level*.12);
  x.save(); x.lineCap='round';
  for(const [lw,al] of [[7,.18],[3.2,.85]]) for(const ph of strands){ x.strokeStyle=`rgba(${GOLD},${al})`; x.lineWidth=lw; x.beginPath();
    for(let yy=C+64; yy>=C-32; yy-=3){ const k=(C+64-yy)/96, amp=12-6*k, xx=C+Math.sin(yy*.07+ph+t/2500)*amp; yy===C+64?x.moveTo(xx,yy):x.lineTo(xx,yy);} x.stroke(); }
  x.restore(); if(!treeCache) buildTreeCache(); x.drawImage(treeCache,0,0,S,S);
  if(Math.random()<.06+level*.45) T.pulses.push({i:T.starts[Math.random()*2|0],t:0});
  for(let k=T.pulses.length-1;k>=0;k--){const q=T.pulses[k],s=T.segs[q.i]; q.t+=.045+level*.05;
    if(q.t>=1){ if(!s.kids.length){T.pulses.splice(k,1); glow(x,s.x2,s.y2,10,.9); continue;} q.i=s.kids[Math.random()*s.kids.length|0]; q.t=0; continue;}
    const [px,py]=quad(s,q.t); glow(x,px,py,6,.95); }
  for(let k=0;k<3+level*8;k++){const s=T.segs[T.tips[Math.random()*T.tips.length|0]]; if(s) glow(x,s.x2,s.y2,4+Math.random()*4,.5+Math.random()*.4);}
  WELLS.forEach(([id],i)=>{ const [wx,wy]=wellsPos[i]; wellLevel[id]*=.97; const L=wellLevel[id];
    glow(x,wx,wy,16+Math.sin(t/500+i)*3+L*16,.8+L*.2); x.strokeStyle=`rgba(${GOLD},${.55+L*.4})`; x.lineWidth=1+L; x.beginPath(); x.ellipse(wx,wy,15+L*4,6+L*1.5,0,0,7); x.stroke(); });
  glow(x,C,C+15,26+level*10,.5+level*.3);
}

/* ---------- blaster bolts ---------- */
function blast(fromKey,toKey,count=3){
  const from=anchors[fromKey], to=anchors[toKey]; if(!from||!to) return;
  const dx=to.x-from.x, dy=to.y-from.y, dist=Math.hypot(dx,dy), ux=dx/dist, uy=dy/dist, len=Math.min(34,dist*.25), dur=Math.max(260,dist*.9);
  const g=guides.querySelector(`[data-id="${toKey}"],[data-id="${fromKey}"]`); if(g){g.classList.add('hot'); setTimeout(()=>g.classList.remove('hot'),dur+500);}
  play('fx');
  for(let k=0;k<count;k++){ const grp=document.createElementNS(NS,'g'), gl=document.createElementNS(NS,'line'), bm=document.createElementNS(NS,'line');
    gl.setAttribute('stroke','var(--accent)'); gl.setAttribute('stroke-width','8'); gl.setAttribute('stroke-linecap','round'); gl.setAttribute('filter','url(#blur)');
    bm.setAttribute('stroke','#fff8dc'); bm.setAttribute('stroke-width','2.6'); bm.setAttribute('stroke-linecap','round'); grp.append(gl,bm); bolts.appendChild(grp);
    const start=performance.now()+k*115;
    (function step(t){ const q=(t-start)/dur; if(q<0){grp.style.opacity=0; return requestAnimationFrame(step);} grp.style.opacity=1;
      const head=Math.min(q,1)*dist, tail=Math.max(0,head-len);
      for(const el of [gl,bm]){el.setAttribute('x1',from.x+ux*tail);el.setAttribute('y1',from.y+uy*tail);el.setAttribute('x2',from.x+ux*head);el.setAttribute('y2',from.y+uy*head);}
      if(q<1+len/dist) requestAnimationFrame(step); else { grp.remove(); if(k===count-1) impact(toKey); } })(performance.now()); }
}
function impact(key){ const n=node(key); if(n){n.classList.remove('hit'); void n.offsetWidth; n.classList.add('hit');} if(key in wellLevel) wellLevel[key]=1; if(key==='crown'||key==='root') busyPulse(); }
function busyPulse(){ level=Math.min(1,level+.4); }
function light(id,ms=1800){const n=node(id); if(!n) return; n.classList.add('active'); clearTimeout(n._t); if(ms) n._t=setTimeout(()=>n.classList.remove('active'),ms);}
function unlight(id){node(id)?.classList.remove('active');}
function chipFlash(id){const c=$(id); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1400);}

const wait=ms=>new Promise(r=>setTimeout(r,ms)); const stats={};
async function runQuery({via,text,category,agent,memory,web,well,reply,src,after}){
  if(via==='Telegram'){ chipFlash('chipTg'); blast('telegram','crown'); await wait(700); }
  msg('user',text,via==='Telegram'?'✈ Telegram':via);
  await wait(600); busy(true,'<b>Oden</b> analyserar'); step(`Oden: '${category}' → ${NAMES[agent]||agent}`);
  if(agent==='reminder_agent'){ await wait(400); busy(true,'Arbetar · <b>Planering</b>'); blast('root','urd'); await wait(1200); }
  else { await wait(400); busy(true,`Arbetar · <b>${NAMES[agent]}</b>`); blast('crown',agent); light(agent,0); await wait(900); }
  if(memory){ busy(true,'Hämtar ur <b>Mimers brunn</b>'); blast('root','mimer'); await wait(650); blast('mimer','root'); step(memory); await wait(700); }
  if(web){ busy(true,'Söker på <b>webben</b>'); node(agent).classList.add('searching'); chipFlash('chipWeb'); step(`Söker på webben: ${web}`); await wait(1900);
    node(agent).classList.remove('searching'); step('Hittade 5 källor'); await wait(500); }
  busy(true,`<b>${NAMES[agent]}</b> skriver svar till Oden`); await wait(900);
  if(agent!=='reminder_agent'){ blast(agent,'crown'); await wait(450); unlight(agent); }
  busy(false); const secs=+(3+Math.random()*4).toFixed(1); const st=stats[agent]=stats[agent]||{n:0,t:[],last:''}; st.n++; st.t.push(secs); st.last=text.slice(0,46);
  step(`${NAMES[agent]} svarade på ${secs} s`); msg('jarvis',reply,NAMES[agent],src); chime();
  if(via==='Telegram'){ await wait(300); blast('crown','telegram'); chipFlash('chipTg'); }
  if(after) await after();
}

  [/kurs|uppgift|föreläsning|tenta/i,'skola'],[/bvc|förskola|vaccin/i,'familj'],[/match|domar|fogis|ibis/i,'domare']];
function fileIntake(name){ sys(`📄 ${name} – Oden läser filen…`); busy(true,'<b>Oden</b> läser filen'); blast('root','mimer');
  setTimeout(()=>{ busy(false); const hit=RULES.find(([re])=>re.test(name));
    if(hit){ msg('jarvis',`Jag sparade <b>${name}</b> i <b>data/documents/${hit[1]}</b> och har lärt mig innehållet.`,'Oden'); wellLevel.mimer=1; return; }
    const m=document.createElement('div'); m.className='msg jarvis';
    m.innerHTML=`<small><span>Oden</span><span>${now()}</span></small>Jag är osäker på var <b>${name}</b> hör hemma. Var vill du ha den?
      <div class="secbtns" style="margin-top:8px">${FOLDERS.map(f=>`<button data-folder="${f}">${f}</button>`).join('')}<button data-folder="?">Ny mapp…</button></div>`;
    add(m); m.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{ const f=b.dataset.folder==='?'?(prompt('Namn på ny mapp:')||'övrigt'):b.dataset.folder;
      m.querySelector('.secbtns').remove(); msg('user',f,'Du'); msg('jarvis',`Klart – sparad i <b>data/documents/${f}</b>. Jag kommer ihåg det till nästa gång.`,'Oden'); wellLevel.mimer=1; blast('root','mimer'); });
  },1600); }

let ORDER=Object.keys(LEAGUES), leagueIdx=0, pageIdx=0, leagueLock=null, tickTimer=null;
const gdate=o=>o===0?'Idag':o===-1?'Igår':(d=>`${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`)(addD(today0,o));
function perPage(){ return Math.max(1,Math.min(4,Math.floor($('track').clientWidth/360))); }
function gameHTML(g,gi){ const [a,as,b,bs,st,x,off,live]=g, aw=as>bs, bw=bs>as;
  return `<span class="game" data-g="${gi}"><span class="dt">${gdate(off)}</span><b class="${aw?'w':bw?'l':''}">${a} ${as}</b><span class="sep">–</span><b class="${bw?'w':aw?'l':''}">${bs} ${b}</b><span class="st${live?' live':''}">${live?'LIVE '+st:st}</span>${x?`<span class="x">${x}</span>`:''}</span>`; }
function renderPage(){ const name=ORDER[leagueIdx], games=LEAGUES[name], n=perPage(), pages=Math.ceil(games.length/n), tape=$('tape');
  $('leagueName').textContent=name;
  tape.innerHTML=games.slice(pageIdx*n,pageIdx*n+n).map((g,i)=>gameHTML(g,pageIdx*n+i)).join('');
  $('pager').innerHTML=Array.from({length:pages},(_,i)=>`<i class="${i===pageIdx?'on':''}"></i>`).join(''); renderLeagueMenu(); }
function nextPage(){ const name=ORDER[leagueIdx], pages=Math.ceil(LEAGUES[name].length/perPage()), tape=$('tape');
  tape.classList.add('out');
  setTimeout(()=>{ pageIdx++; if(pageIdx>=pages){ pageIdx=0; if(leagueLock==null) leagueIdx=(leagueIdx+1)%ORDER.length; }
    tape.classList.remove('out'); tape.classList.add('in'); renderPage(); void tape.offsetWidth; tape.classList.remove('in'); },450); }
function startTicker(){ clearInterval(tickTimer); tickTimer=setInterval(()=>{ if(!$('sports').matches(':hover')) nextPage(); },6500); }
function showLeague(i){ leagueIdx=i; pageIdx=0; renderPage(); startTicker(); }
function renderLeagueMenu(){ $('leagueMenu').innerHTML=`<div data-l="auto" class="${leagueLock==null?'on':''}">Rulla alla ligor<span>${leagueLock==null?'✓':''}</span></div>`+
  ORDER.map((n,i)=>`<div data-l="${i}" class="${leagueLock===i?'on':''}">${n}<span>${leagueLock===i?'✓':''}</span></div>`).join('');
  $('leagueMenu').querySelectorAll('[data-l]').forEach(d=>d.onclick=e=>{ e.stopPropagation(); const v=d.dataset.l; leagueLock=v==='auto'?null:+v;
    $('leagueMenu').classList.remove('open'); showLeague(leagueLock!=null?leagueLock:leagueIdx); }); }
$('league').onclick=e=>{ e.stopPropagation(); $('leagueMenu').classList.toggle('open'); };
addEventListener('resize',()=>{ pageIdx=0; renderPage(); });
/* "Oden, lägg till Premier League i resultaten" -> settings change (demo) */
function sportsCommand(text){ const add=text.match(/lägg till (.+?) (?:i|på) (?:resultat|resultaten|resultatlisten|listen)/i), rem=text.match(/ta bort (.+?) (?:från|ur|i) (?:resultat|resultaten|resultatlisten|listen)/i);
  if(add){ const key=add[1].toLowerCase().trim(), name=add[1].replace(/\b\w/g,c=>c.toUpperCase());
    if(ORDER.some(n=>n.toLowerCase()===key)) return `${name} finns redan i resultatlisten.`;
    LEAGUES[name]=EXTRA[key]||[['HEM',1,'BOR',0,'Slut','',-1]]; ORDER=Object.keys(LEAGUES); renderLeagueMenu(); return `Klart – ${name} är tillagd i resultatlisten. Jag har sparat det i dina inställningar.`; }
  if(rem){ const key=rem[1].toLowerCase().trim(), hit=ORDER.find(n=>n.toLowerCase()===key); if(!hit) return `Jag hittar ingen liga som heter ${rem[1]} i listen.`;
    delete LEAGUES[hit]; ORDER=Object.keys(LEAGUES); leagueIdx=0; pageIdx=0; renderPage(); return `${hit} är borttagen från resultatlisten.`; }
  return null; }
function gamePanel(league,[a,as,b,bs,st,x,live]){ const q=n=>Array.from({length:n},()=>Math.floor(Math.random()*(league==='NBA'?35:league==='NFL'?11:2)));
  const n=league==='MLB'?9:league==='NHL'||league==='SHL'?3:league==='Allsvenskan'?2:4, qa=q(n), qb=q(n);
  panel.innerHTML=`<h3><span>${league} · ${a} – ${b}</span><button data-close>✕</button></h3>
   <div class="wxnow" style="justify-content:center;gap:28px"><div class="t" style="font-size:40px">${a} ${as}</div><div style="color:var(--muted)">${st}</div><div class="t" style="font-size:40px">${bs} ${b}</div></div>
   <table class="box"><tr><th>Lag</th>${qa.map((_,i)=>`<th>${i+1}</th>`).join('')}<th>Tot</th></tr><tr><td>${a}</td>${qa.map(v=>`<td>${v}</td>`).join('')}<td><b>${as}</b></td></tr><tr><td>${b}</td>${qb.map(v=>`<td>${v}</td>`).join('')}<td><b>${bs}</b></td></tr></table>
   <div class="chk"><div>${live?'Matchen pågår':'Matchens spelare'}<small>${x}</small></div></div>
   <div class="src2">Demo-data i förhandsvisningen · riktig data hämtas och cachas av Yggdrasil</div>`;
  panel.classList.add('open'); bindPanel(); }
showLeague(0);

/* ---------- expanded results with logos; a match opens ESPN ---------- */
const ESPN={NFL:['football','nfl'],NHL:['hockey','nhl'],MLB:['baseball','mlb'],NBA:['basketball','nba']};
const logo=(lg,ab)=>ESPN[lg]?`https://a.espncdn.com/i/teamlogos/${ESPN[lg][1]}/500/${ab.toLowerCase()}.png`:'';
const espnUrl=lg=>ESPN[lg]?`https://www.espn.com/${ESPN[lg][1]}/scoreboard`:lg==='Premier League'?'https://www.espn.com/soccer/scoreboard/_/league/eng.1':'https://www.espn.com/soccer/scoreboard';
function teamRow(lg,ab,pts,cls){ const src=logo(lg,ab);
  return `<div class="team ${cls}">${src?`<img src="${src}" alt="" onerror="this.outerHTML='<span class=lg>${ab}</span>'">`:`<span class="lg">${ab}</span>`}<span class="nm">${ab}</span><span class="pt">${pts}</span></div>`; }
function openScores(name){ const games=LEAGUES[name];
  $('scTabs').innerHTML=ORDER.map(n=>`<button class="cbtn${n===name?' on':''}" data-sl="${n}">${n}</button>`).join('')+'<button class="cbtn close" data-sx>✕</button>';
  $('scGrid').innerHTML=games.map(([a,as,b,bs,st,x,off,live])=>`<a class="card" href="${espnUrl(name)}" target="_blank" rel="noopener noreferrer">
     <div class="top"><span>${gdate(off)}</span><span class="${live?'live':''}">${live?'LIVE '+st:st}</span></div>
     ${teamRow(name,a,as,as>bs?'win':as<bs?'lose':'')}${teamRow(name,b,bs,bs>as?'win':bs<as?'lose':'')}
     <div class="note">${x||'&nbsp;'}<span class="go">Läs på ESPN ↗</span></div></a>`).join('');
  $('scores').classList.add('open'); clearInterval(tickTimer);
  $('scTabs').querySelectorAll('[data-sl]').forEach(b=>b.onclick=e=>{e.stopPropagation(); openScores(b.dataset.sl);});
  $('scTabs').querySelector('[data-sx]').onclick=e=>{e.stopPropagation(); closeScores();}; }
function closeScores(){ $('scores').classList.remove('open'); startTicker(); }
$('track').onclick=e=>{ e.stopPropagation(); $('scores').classList.contains('open')?closeScores():openScores(ORDER[leagueIdx]); };
$('scores').onclick=e=>e.stopPropagation();

function bgLayout(){ if(!mythGeo||!BG) return; const w=$('bgwrap'), z=+$('bgSize').value/100, mid=mythGeo.midR-mythGeo.midL;
  const W=mid*z, H=W/BG.ratio, cx=mythGeo.midL+mid/2+(+$('bgX').value/100)*mid, cy=mythGeo.cy+(+$('bgY').value/100)*mythGeo.s;
  Object.assign(w.style,{width:W+'px',height:H+'px',left:(cx-W/2)+'px',top:(cy-H/2)+'px'}); w.dataset.dx=((mythGeo.cx-(cx-W/2))/W*100).toFixed(1); w.dataset.dy=((mythGeo.cy-mythGeo.s*.12-(cy-H/2))/H*100).toFixed(1); bgDimPaint(); }
function bgDimPaint(){ const w=$('bgwrap'); $('bgdim').style.background=`radial-gradient(ellipse 20% 30% at ${w.dataset.dx||50}% ${w.dataset.dy||40}%,rgba(0,0,0,${$('bgDim').value/100}),transparent 100%)`; }
function bgApply(){ const w=$('bgwrap'); $('bgimg').style.backgroundImage=BG.src?`url(${BG.src})`:'none';
  w.style.opacity=BG.src?$('bgStrength').value/100:0; 
  $('vS').textContent=$('bgStrength').value+'%'; $('vZ').textContent=$('bgSize').value+'%'; $('vX').textContent=$('bgX').value; $('vY').textContent=$('bgY').value; $('vD').textContent=$('bgDim').value+'%'; bgEdges(); bgLayout(); }
['bgStrength','bgSize','bgX','bgY','bgDim','bgEdgeW','bgEdgeS'].forEach(id=>$(id).oninput=bgApply);
function bgEdges(){ const w=+$('bgEdgeW').value, a=(1-$('bgEdgeS').value/100).toFixed(2), e=`rgba(0,0,0,${a})`;
  const m=`linear-gradient(90deg,${e},#000 ${w}%,#000 ${100-w}%,${e}),linear-gradient(${e},#000 ${w*1.2}%,#000 ${100-w*1.2}%,${e})`;
  const el=$('bgimg'); el.style.webkitMaskImage=m; el.style.maskImage=m; $('vEW').textContent=w+'%'; $('vES').textContent=$('bgEdgeS').value+'%'; }
function setBg(file){ if(!file||!file.type.startsWith('image/')) return false; const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{ BG.ratio=im.width/im.height; BG.src=r.result; bgApply(); sys('🖼 Ny bakgrundsbild (bara i förhandsvisningen)'); }; im.src=r.result; };
  r.readAsDataURL(file); return true; }
$('bgPick').onclick=()=>$('bgFile').click(); $('bgFile').onchange=e=>setBg(e.target.files[0]);
$('bgOff').onclick=()=>{BG.src=''; bgApply();};
function togglePop(id,e){ e.stopPropagation(); ['bgPop','soundPop'].forEach(p=>{ if(p!==id) $(p).classList.remove('open'); }); $(id).classList.toggle('open'); }
$('bgBtn').onclick=e=>togglePop('bgPop',e); $('bgPop').onclick=e=>e.stopPropagation();

/* ---------- sound levels per category ---------- */
const SOUND=[['voice','🗣','Odens röst','Uppläsning av svar (kommer med röststeget)',80],['reply','💬','Svar','Ljud när ett svar kommer',40],
  ['reminder','⏰','Påminnelser','',70],['mail','✉','Mail-notiser','',30],['fx','✦','Effekter','Skott och pulser',0]];
const vol={}, muted={}; SOUND.forEach(([k,,,,v])=>{vol[k]=v; muted[k]=false;});
function renderSound(){ $('soundRows').innerHTML=SOUND.map(([k,ic,name,desc])=>`<div class="srow${muted[k]||!vol[k]?' muted':''}"><button data-mute="${k}" title="Av/på">${muted[k]||!vol[k]?'🔇':ic}</button>
    <span>${name}${desc?`<small>${desc}</small>`:''}</span><input type="range" min="0" max="100" value="${vol[k]}" data-vol="${k}"><span class="v">${vol[k]}%</span></div>`).join('');
  $('soundRows').querySelectorAll('[data-vol]').forEach(r=>r.oninput=()=>{vol[r.dataset.vol]=+r.value; r.nextElementSibling.textContent=r.value+'%'; r.parentElement.classList.toggle('muted',!+r.value||muted[r.dataset.vol]);});
  $('soundRows').querySelectorAll('[data-vol]').forEach(r=>r.onchange=()=>{renderSound(); play(r.dataset.vol);});
  $('soundRows').querySelectorAll('[data-mute]').forEach(b=>b.onclick=()=>{muted[b.dataset.mute]=!muted[b.dataset.mute]; renderSound();}); }
renderSound();
$('masterMute').onchange=e=>{ masterMute=e.target.checked; $('soundRows').classList.toggle('off',masterMute);
  $('sound').textContent=masterMute?'Tyst':'Ljud'; $('sound').classList.toggle('silent',masterMute); };
$('sound').onclick=e=>togglePop('soundPop',e); $('soundPop').onclick=e=>e.stopPropagation();
let masterMute=false;
function play(cat){ if(masterMute) return; const v=muted[cat]?0:vol[cat]/100; if(!v) return; try{ ac=ac||new AudioContext(); const o=ac.createOscillator(),g=ac.createGain();
  const f={reply:880,reminder:990,mail:660,fx:1400,voice:520}[cat]||800; o.type=cat==='fx'?'square':'sine'; o.frequency.setValueAtTime(f,ac.currentTime);
  if(cat==='fx') o.frequency.exponentialRampToValueAtTime(f*.3,ac.currentTime+.09);
  g.gain.value=.06*v; g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(cat==='fx'?.1:.35)); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.36);}catch(e){} }
/* ---------- loops ---------- */
const cv=$('sparks'), cx=cv.getContext('2d'); let sp=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight; sp=Array.from({length:60},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,v:Math.random()*.22+.05,a:Math.random()*6}));}
addEventListener('resize',rs); rs();
bgApply();
(function loop(t){ drawMyth(t); drawTree(t); cx.clearRect(0,0,cv.width,cv.height); cx.fillStyle='#f0b43c';
  for(const s of sp){ s.y-=s.v; s.a+=.012; if(s.y<-5){s.y=cv.height+5; s.x=Math.random()*cv.width;} cx.globalAlpha=.18+.3*Math.abs(Math.sin(s.a)); cx.beginPath(); cx.arc(s.x,s.y,s.r,0,7); cx.fill(); }
  requestAnimationFrame(loop); })(0);
</script>
</body>
